const getDayType = (day) => {
  if (day.pending) return 'workout';
  const resolved = day.referenceDay
    ? (routineData.find(d => d.id === day.referenceDay) || day)
    : day;
  return resolved.circuits.length > 0 ? 'workout' : 'rest';
};

  const activePhase = phases.find(p => p.id === activePhaseId);
  const phaseDays = activePhase.dayIds.map(id => routineData.find(d => d.id === id)).filter(Boolean);

  const selectedDay = routineData.find(d => d.id === activeDayId);
  const activeDay = selectedDay?.referenceDay
    ? { ...selectedDay, circuits: (routineData.find(d => d.id === selectedDay.referenceDay) || selectedDay).circuits }
    : selectedDay;

  // Group days into rows of 7 (weeks)
  const weeks = [];
  for (let i = 0; i < phaseDays.length; i += 7) {
    weeks.push(phaseDays.slice(i, i + 7));
  }

  return (
    <div className="min-h-screen pb-12">
      <Header />
      <main className="max-w-3xl mx-auto px-4">

        {/* Phase Selector */}
        <div className="flex gap-3 mb-5">
          {phases.map(phase => (
            <button
              key={phase.id}
              onClick={() => {
                setActivePhaseId(phase.id);
                const firstId = phase.dayIds[0];
                if (firstId) setActiveDayId(firstId);
              }}
              className={`flex-1 py-3 rounded-2xl font-bold text-base transition-all ${
                activePhaseId === phase.id
                  ? 'bg-purple-700 text-white shadow-lg'
                  : 'bg-white text-purple-700 border-2 border-purple-200 hover:bg-purple-50'
              }`}
            >
              {phase.name}
              {phase.dayIds.length === 0 && (
                <span className="ml-2 text-xs opacity-60">Próximamente</span>
              )}
            </button>
          ))}
        </div>

        {/* Day Grid */}
        {phaseDays.length > 0 ? (
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-6">
            <div className="grid grid-cols-7 gap-1 mb-2">
              {['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d => (
                <div key={d} className="text-center text-[10px] font-bold text-gray-400 pb-1">{d}</div>
              ))}
            </div>
            {weeks.map((week, wi) => (
              <div key={wi} className="grid grid-cols-7 gap-1 mb-1">
                {week.map(day => {
                  const isWorkout = getDayType(day) === 'workout';
                  const isActive = day.id === activeDayId;
                  const dayNum = parseInt(day.id.match(/(\d+)$/)?.[1] || '0');
                  return (
                    <button
                      key={day.id}
                      onClick={() => setActiveDayId(day.id)}
                      title={day.dayName}
                      className={`aspect-square rounded-xl flex flex-col items-center justify-center font-bold transition-all ${
                        isActive
                          ? 'bg-purple-600 text-white shadow-md scale-105'
                          : isWorkout
                          ? 'bg-purple-50 text-purple-700 hover:bg-purple-100'
                          : 'bg-gray-50 text-gray-400 hover:bg-gray-100'
                      }`}
                    >
                      <span className="text-sm leading-none">{dayNum}</span>
                      <span className="text-xs leading-none mt-0.5">{isWorkout ? '💪' : '🧘'}</span>
                    </button>
                  );
                })}
                {week.length < 7 && Array(7 - week.length).fill(null).map((_, i) => (
                  <div key={`empty-${i}`} className="aspect-square" />
                ))}
              </div>
            ))}
          </div>
        ) : (
          <div className="bg-white rounded-2xl border-2 border-dashed border-purple-200 p-10 mb-6 text-center">
            <span className="text-4xl mb-3 block">🚧</span>
            <p className="text-purple-500 font-bold text-lg">Fase 2 — Próximamente</p>
            <p className="text-gray-400 text-sm mt-1">Los días de esta fase estarán disponibles muy pronto.</p>
          </div>
        )}

        {/* Active Day Info */}
        {activeDay && (
          <>
            <div className="bg-purple-50 p-4 rounded-xl border border-purple-100 mb-6">
              <div className="flex items-center gap-2 flex-wrap">
                <h2 className="font-bold text-purple-800 text-xl">{activeDay.dayName}</h2>
                {selectedDay?.referenceDay && (
                  <span className="bg-purple-200 text-purple-800 text-xs font-bold px-2 py-1 rounded-full">
                    🔁 Igual al {routineData.find(d => d.id === selectedDay.referenceDay)?.dayName.split(':')[0]}
                  </span>
                )}
              </div>
              <p className="text-purple-600 text-sm flex items-start gap-2 mt-2">
                <svg className="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                {activeDay.notes}
              </p>
            </div>

            <div className="animate-fade-in">
              {activeDay.circuits.length > 0 ? (
                <>
                  {activeDay.circuits.map(circuit => (
                    <CircuitSection key={circuit.id} circuit={circuit} />
                  ))}
                  <div className="mt-8 text-center">
                    <button className="bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-transform hover:scale-105 active:scale-95">
                      ¡Completar {activeDay.dayName.split(':')[0]}!
                    </button>
                  </div>
                </>
              ) : (
                <div className="text-center py-16 bg-white rounded-2xl shadow-sm border border-purple-100 flex flex-col items-center justify-center">
                  <span className="text-6xl mb-4">🧘‍♀️</span>
                  <h3 className="text-2xl font-bold text-gray-800">¡Día Libre!</h3>
                  <p className="text-gray-500 mt-2 max-w-sm">Aprovecha para hidratarte, estirar y permitir que tus músculos se recuperen al 100%.</p>
                </div>
              )}
            </div>
          </>
        )}
      </main>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
